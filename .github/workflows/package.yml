name: Build BG3 mod
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install bg3forge==0.2.0
      - run: python tools/check.py
      - run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: TacticianAI
          path: dist/TacticianAI.pak
          if-no-files-found: error
